name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android NDK & CMake
        run: |
          echo "Installing NDK 27.0.12077973 and CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "Release tag will be: $TAG"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > autoroid-release.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "" | base64 --decode > autoroid-release.jks
            echo "KEYSTORE_PASSWORD=autoroid123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=../autoroid-release.jks" >> $GITHUB_ENV
          echo "KEY_ALIAS=key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=autoroid123" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          python3 -c "
          import re
          tag = '${{ steps.vars.outputs.tag }}'
          version = tag.lstrip('v')
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'## \[(?:v)?{re.escape(version)}\].*?(?=(?:\n## \[|\Z))'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(0).strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(notes + '\n')
                  print('Extracted changelog for ' + tag)
              else:
                  with open('release_notes.md', 'w') as out:
                      out.write('### Autoroid ' + tag + '\n\nAutomated release build.\n')
          except Exception as e:
              with open('release_notes.md', 'w') as out:
                  out.write('### Autoroid ' + tag + '\n\nAutomated release build.\n')
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Autoroid ${{ steps.vars.outputs.tag }}"
          files: app/build/outputs/apk/release/app-release.apk
          body_path: release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
